@if (useVirtualQuestionList()) {
  <div
    class="border-b border-amber-100/80 bg-amber-50/50 text-[10px] text-amber-900 px-3 py-1 sm:hidden"
  >
    Virtual list ({{ items.length }} questions)
  </div>
  <cdk-virtual-scroll-viewport
    [itemSize]="virtualRowHeightPx"
    minBufferPx="160"
    maxBufferPx="320"
    class="fb-vscroll-nested w-full min-h-[min(50vh,36rem)] h-[min(50vh,36rem)]"
  >
    <app-form-virtual-row
      *cdkVirtualFor="let row of questionOnlyFlatRows(); trackBy: trackQuestionFlatRow"
      [row]="row"
      [selected]="isRowSelected(row.item.id)"
      [virtualMode]="true"
      (rowAction)="onQuestionVirtualAction($event)"
    />
  </cdk-virtual-scroll-viewport>
} @else {
  @for (child of sortItems(items); track child.id) {
    @if (child.type === 'section') {
      <!-- ── Nested Section ──────────────────────────────────────────────── -->
      <div
        class="group/ns transition-all duration-150"
        [style.padding-left.px]="depth * 24"
        [class.opacity-40]="isDragging(child)"
        [class.border-t-2]="isDropTarget(child)"
        [class.border-blue-400]="isDropTarget(child)"
        [class.ring-2]="isRowSelected(child.id)"
        [class.ring-blue-400]="isRowSelected(child.id)"
        [class.relative]="isRowSelected(child.id)"
        [class.z-10]="isRowSelected(child.id)"
        (click)="onSelectableClick($event, child.id)"
        [attr.draggable]="$any(child).collapsed ? 'true' : 'false'"
        (dragstart)="onDragStart($event, child)"
        (dragover)="onDragOver($event, child)"
        (dragleave)="onDragLeave($event)"
        (drop)="onDrop($event, child)"
        (dragend)="onDragEnd()"
      >
        <!-- Section header row -->
        <div class="flex items-center gap-2 pr-4 py-2 bg-gray-100/80 border-t border-gray-100">
          <!-- drag handle -->
          <span
            class="cursor-grab text-gray-300 hover:text-gray-500 flex-shrink-0 pl-1"
            [class.cursor-not-allowed]="!$any(child).collapsed"
            [title]="!$any(child).collapsed ? 'Collapse section to drag' : 'Drag to reorder'"
          >
            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
              <circle cx="7" cy="4" r="1.2" />
              <circle cx="13" cy="4" r="1.2" />
              <circle cx="7" cy="10" r="1.2" />
              <circle cx="13" cy="10" r="1.2" />
              <circle cx="7" cy="16" r="1.2" />
              <circle cx="13" cy="16" r="1.2" />
            </svg>
          </span>

          <!-- collapse chevron -->
          <button
            (click)="toggleCollapse.emit({ id: child.id, path: path })"
            class="text-gray-400 hover:text-gray-600 transition flex-shrink-0"
            [attr.aria-label]="$any(child).collapsed ? 'Expand section' : 'Collapse section'"
          >
            <svg
              class="w-3 h-3 transition-transform duration-150"
              [class.-rotate-90]="$any(child).collapsed"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2.5"
                d="M19 9l-7 7-7-7"
              />
            </svg>
          </button>

          <!-- title -->
          <input
            [value]="child.title"
            (input)="
              titleChange.emit({ id: child.id, value: $any($event.target).value, path: path })
            "
            class="flex-1 text-xs font-semibold text-gray-700 bg-transparent outline-none placeholder-gray-400"
            placeholder="Section title..."
            [attr.aria-label]="'Section title'"
          />

          <!-- hover actions -->
          <div
            class="flex items-center gap-1 opacity-100 sm:opacity-0 sm:group-hover/ns:opacity-100 transition"
          >
            <button
              (click)="addQuestion.emit({ id: child.id, path: path })"
              class="text-[10px] text-blue-500 px-1.5 py-0.5 rounded hover:bg-blue-50 transition"
            >
              + Question
            </button>
            <button
              (click)="addSection.emit({ id: child.id, path: path })"
              class="text-[10px] text-gray-500 px-1.5 py-0.5 rounded hover:bg-gray-100 transition"
            >
              + Section
            </button>
            <button
              (click)="deleteItem.emit({ id: child.id, path: path })"
              class="text-gray-300 hover:text-red-400 transition p-0.5"
              aria-label="Delete section"
            >
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M4 7h16M10 3h4a1 1 0 011 1v3H9V4a1 1 0 011-1z"
                />
              </svg>
            </button>
          </div>
        </div>

        <!-- Recursive children -->
        @if (!$any(child).collapsed) {
          <div class="bg-blue-50/10">
            <app-section-children
              [items]="$any(child).children"
              [depth]="depth + 1"
              [path]="buildPath(path, child.id)"
              [pageId]="pageId"
              [listSelection]="listSelection"
              (addQuestion)="addQuestion.emit($event)"
              (addSection)="addSection.emit($event)"
              (deleteItem)="deleteItem.emit($event)"
              (titleChange)="titleChange.emit($event)"
              (typeChange)="typeChange.emit($event)"
              (toggleCollapse)="toggleCollapse.emit($event)"
              (reorder)="reorder.emit($event)"
              (selectRows)="selectRows.emit($event)"
            />
          </div>
        }
      </div>
    } @else {
      <!-- ── Question Row ──────────────────────────────────────────────────── -->
      <div
        class="flex flex-col gap-2 sm:grid sm:grid-cols-[1fr_minmax(0,200px)_40px] sm:items-center border-t border-gray-50 group/row hover:bg-blue-50/40 transition-all duration-150 cursor-grab min-w-0"
        [style.padding-left.px]="depth * 24 + 16"
        [class.opacity-40]="isDragging(child)"
        [class.border-t-2]="isDropTarget(child)"
        [class.border-blue-400]="isDropTarget(child)"
        [class.bg-blue-50]="isDropTarget(child)"
        [class.ring-2]="isRowSelected(child.id)"
        [class.ring-blue-400]="isRowSelected(child.id)"
        [class.relative]="isRowSelected(child.id)"
        [class.z-10]="isRowSelected(child.id)"
        (click)="onSelectableClick($event, child.id)"
        draggable="true"
        (dragstart)="onDragStart($event, child)"
        (dragover)="onDragOver($event, child)"
        (dragleave)="onDragLeave($event)"
        (drop)="onDrop($event, child)"
        (dragend)="onDragEnd()"
        role="listitem"
      >
        <!-- drag handle -->
        <div class="flex items-center gap-2 py-2 sm:pr-2 sm:border-r border-gray-100 min-w-0">
          <span
            class="cursor-grab text-gray-200 group-hover/row:text-gray-400 transition flex-shrink-0"
          >
            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
              <circle cx="7" cy="4" r="1.2" />
              <circle cx="13" cy="4" r="1.2" />
              <circle cx="7" cy="10" r="1.2" />
              <circle cx="13" cy="10" r="1.2" />
              <circle cx="7" cy="16" r="1.2" />
              <circle cx="13" cy="16" r="1.2" />
            </svg>
          </span>
          <input
            [value]="child.title"
            (input)="
              titleChange.emit({ id: child.id, value: $any($event.target).value, path: path })
            "
            class="flex-1 text-xs text-gray-700 bg-transparent outline-none placeholder-gray-400 py-1"
            placeholder="Question..."
            [attr.aria-label]="'Question text'"
          />
        </div>

        <!-- type dropdown -->
        <div class="flex items-center gap-2 px-0 sm:px-2 py-1 sm:border-r border-gray-100 min-w-0">
          <span
            class="text-[10px] flex-shrink-0"
            [class.text-green-600]="$any(child).type === 'checkbox'"
            [class.text-blue-500]="$any(child).type !== 'checkbox'"
          >
            @if ($any(child).type === 'checkbox') {
              <svg class="w-3 h-3 inline mr-0.5" fill="currentColor" viewBox="0 0 20 20">
                <path
                  d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                />
              </svg>
              <span>Checkbox</span>
            } @else {
              <svg
                class="w-3 h-3 inline mr-0.5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h8"
                />
              </svg>
              <span>Text answer</span>
            }
          </span>
          <select
            [value]="$any(child).type"
            (change)="
              typeChange.emit({ id: child.id, value: $any($event.target).value, path: path })
            "
            class="flex-1 sm:ml-auto text-[11px] text-gray-500 bg-transparent outline-none cursor-pointer w-full min-h-11 sm:min-h-0 rounded border border-gray-200 sm:border-0 px-2 sm:px-0"
            [attr.aria-label]="'Response type'"
          >
            <option value="text">Text answer</option>
            <option value="checkbox">Checkbox</option>
          </select>
        </div>

        <!-- delete -->
        <div class="flex justify-end sm:justify-center py-1">
          <button
            type="button"
            (click)="deleteItem.emit({ id: child.id, path: path })"
            class="text-gray-300 hover:text-red-400 transition p-2 sm:p-0.5 min-h-11 min-w-11 sm:min-h-0 sm:min-w-0 sm:opacity-0 sm:group-hover/row:opacity-100 touch-manipulation"
            aria-label="Delete question"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M4 7h16M10 3h4a1 1 0 011 1v3H9V4a1 1 0 011-1z"
              />
            </svg>
          </button>
        </div>
      </div>
    }
  }
}
