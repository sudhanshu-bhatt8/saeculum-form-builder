@if (row.item.type === 'section') {
  <div
    class="fv-section group/ns border-t border-gray-100 bg-gray-100/80"
    [style.padding-left.px]="row.depth * 24"
    [class.ring-2]="selected"
    [class.ring-blue-400]="selected"
    (click)="onSelect($event, row.item.id)"
  >
    <div class="flex flex-wrap items-center gap-2 px-3 sm:px-4 py-2 min-h-[44px]">
      <span
        class="text-gray-300 flex-shrink-0 pl-0.5 sm:pl-1"
        [title]="virtualMode ? 'Drag reorder disabled in large list mode' : 'Drag handle'"
      >
        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
          <circle cx="7" cy="4" r="1.2" />
          <circle cx="13" cy="4" r="1.2" />
          <circle cx="7" cy="10" r="1.2" />
          <circle cx="13" cy="10" r="1.2" />
          <circle cx="7" cy="16" r="1.2" />
          <circle cx="13" cy="16" r="1.2" />
        </svg>
      </span>
      <button
        type="button"
        (click)="
          rowAction.emit({
            type: 'toggleCollapse',
            pageId: row.pageId,
            parentPath: row.parentPath,
            id: row.item.id,
          })
        "
        class="text-gray-400 hover:text-gray-600 flex-shrink-0 min-h-11 min-w-11 sm:min-h-0 sm:min-w-0 flex items-center justify-center"
        [attr.aria-label]="asSection(row.item).collapsed ? 'Expand section' : 'Collapse section'"
      >
        <svg
          class="w-3 h-3 transition-transform duration-150"
          [class.-rotate-90]="asSection(row.item).collapsed"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2.5"
            d="M19 9l-7 7-7-7"
          />
        </svg>
      </button>
      <input
        [value]="row.item.title"
        (input)="
          rowAction.emit({
            type: 'titleChange',
            pageId: row.pageId,
            parentPath: row.parentPath,
            id: row.item.id,
            value: $any($event.target).value,
          })
        "
        class="flex-1 min-w-[8rem] text-xs font-semibold text-gray-700 bg-transparent outline-none placeholder-gray-400"
        placeholder="Section title..."
        [attr.aria-label]="'Section title'"
      />
      <div class="flex flex-wrap items-center gap-1 w-full sm:w-auto sm:ml-auto opacity-100 sm:opacity-0 sm:group-hover/ns:opacity-100 transition">
        <button
          type="button"
          (click)="
            rowAction.emit({
              type: 'addQuestion',
              pageId: row.pageId,
              parentPath: row.parentPath,
              sectionId: row.item.id,
            })
          "
          class="text-[10px] text-blue-500 px-2 py-1.5 sm:py-0.5 rounded hover:bg-blue-50 min-h-11 sm:min-h-0"
        >
          + Question
        </button>
        <button
          type="button"
          (click)="
            rowAction.emit({
              type: 'addSection',
              pageId: row.pageId,
              parentPath: row.parentPath,
              sectionId: row.item.id,
            })
          "
          class="text-[10px] text-gray-500 px-2 py-1.5 sm:py-0.5 rounded hover:bg-gray-100 min-h-11 sm:min-h-0"
        >
          + Section
        </button>
        <button
          type="button"
          (click)="
            rowAction.emit({
              type: 'delete',
              pageId: row.pageId,
              parentPath: row.parentPath,
              id: row.item.id,
            })
          "
          class="text-gray-300 hover:text-red-400 p-2 sm:p-0.5 min-h-11 min-w-11 sm:min-h-0 sm:min-w-0"
          aria-label="Delete section"
        >
          <svg class="w-3.5 h-3.5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M4 7h16M10 3h4a1 1 0 011 1v3H9V4a1 1 0 011-1z"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>
} @else {
  <div
    class="fv-question group/row border-t border-gray-50 hover:bg-blue-50/40 transition-colors"
    [style.padding-left.px]="row.depth * 24 + 12"
    [class.ring-2]="selected"
    [class.ring-blue-400]="selected"
    (click)="onSelect($event, row.item.id)"
  >
    <div
      class="flex flex-col gap-2 px-3 sm:px-4 py-2 sm:grid sm:grid-cols-[1fr_minmax(0,200px)_40px] sm:items-center sm:gap-0 min-h-[44px]"
    >
      <div class="flex items-center gap-2 py-1 sm:py-2 sm:pr-2 sm:border-r border-gray-100 min-w-0">
        <span class="text-gray-200 group-hover/row:text-gray-400 flex-shrink-0">
          <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
            <circle cx="7" cy="4" r="1.2" />
            <circle cx="13" cy="4" r="1.2" />
            <circle cx="7" cy="10" r="1.2" />
            <circle cx="13" cy="10" r="1.2" />
            <circle cx="7" cy="16" r="1.2" />
            <circle cx="13" cy="16" r="1.2" />
          </svg>
        </span>
        <input
          [value]="row.item.title"
          (input)="
            rowAction.emit({
              type: 'titleChange',
              pageId: row.pageId,
              parentPath: row.parentPath,
              id: row.item.id,
              value: $any($event.target).value,
            })
          "
          class="flex-1 min-w-0 text-xs text-gray-700 bg-transparent outline-none placeholder-gray-400 py-1"
          placeholder="Question..."
          [attr.aria-label]="'Question text'"
        />
      </div>
      <div
        class="flex items-center gap-2 px-0 sm:px-2 py-1 sm:py-1 sm:border-r border-gray-100 min-w-0"
      >
        <span
          class="text-[10px] flex-shrink-0"
          [class.text-green-600]="asQuestion(row.item).type === 'checkbox'"
          [class.text-blue-500]="asQuestion(row.item).type !== 'checkbox'"
        >
          @if (asQuestion(row.item).type === 'checkbox') {
            <span>Checkbox</span>
          } @else {
            <span>Text</span>
          }
        </span>
        <select
          [value]="asQuestion(row.item).type"
          (change)="
            rowAction.emit({
              type: 'typeChange',
              pageId: row.pageId,
              parentPath: row.parentPath,
              id: row.item.id,
              value: $any($event.target).value,
            })
          "
          class="flex-1 sm:ml-auto text-[11px] text-gray-500 bg-transparent outline-none cursor-pointer min-h-11 sm:min-h-0 rounded border border-gray-200 sm:border-0 px-2 sm:px-0"
          [attr.aria-label]="'Response type'"
        >
          <option value="text">Text answer</option>
          <option value="checkbox">Checkbox</option>
        </select>
      </div>
      <div class="flex justify-end sm:justify-center py-1">
        <button
          type="button"
          (click)="
            rowAction.emit({
              type: 'delete',
              pageId: row.pageId,
              parentPath: row.parentPath,
              id: row.item.id,
            })
          "
          class="text-gray-300 hover:text-red-400 p-2 min-h-11 min-w-11 sm:min-h-0 sm:min-w-0 sm:opacity-0 sm:group-hover/row:opacity-100"
          aria-label="Delete question"
        >
          <svg class="w-3.5 h-3.5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M4 7h16M10 3h4a1 1 0 011 1v3H9V4a1 1 0 011-1z"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>
}
